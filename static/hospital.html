<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoadWatch Hospital Demo</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/emergency.css"></head><body><main class="wrap"><h1>Hospital response — DEMO ONLY</h1><p>Local prototype. No authentication, real hospital connection or emergency dispatch. Do not expose this server publicly.</p><div class="glass"><h2>Verified incidents</h2><div id="incidents"></div></div><div class="glass"><h2>Chat</h2><p id="active">Select an incident</p><div id="messages" class="rw-messages"></div><input id="message" placeholder="Reply to operator" maxlength="2000"><button class="btn" id="send">Send</button></div></main><script>
let selected=null;const $=id=>document.getElementById(id);
async function api(url,opts){const r=await fetch(url,opts);const j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j;}
async function load(){try{const incidents=await api('/api/emergency/incidents');$('incidents').replaceChildren();for(const i of incidents){const b=document.createElement('button');b.className='btn ghost';b.textContent=`Incident ${i.job_id} (${i.events.length} alerts)`;b.onclick=()=>{selected=i.job_id;$('active').textContent='Incident '+selected;messages()};$('incidents').appendChild(b);}if(selected)await messages();}catch(e){$('active').textContent=e.message;}}
async function messages(){try{const ms=await api(`/api/emergency/${selected}/messages`);$('messages').replaceChildren();for(const m of ms){const p=document.createElement('p');p.textContent=`${m.sender}: ${m.text}`;$('messages').appendChild(p);}}catch(e){$('active').textContent=e.message;}}
$('send').onclick=async()=>{if(!selected||!$('message').value.trim())return;try{await api(`/api/emergency/${selected}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:'hospital',text:$('message').value})});$('message').value='';await messages();}catch(e){$('active').textContent=e.message;}};load();setInterval(load,3000);
</script></body></html>
